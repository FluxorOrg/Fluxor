name: CI

on:
  push:
    branches:
    - master
  pull_request:
    branches:
    - master

jobs:
  build-apple:
    name: Build and Test (Apple platforms)
    runs-on: macos-latest
    env:
      CC_TEST_REPORTER_ID: ${{ secrets.CC_TEST_REPORTER_ID }}
    steps:
    - uses: actions/checkout@v6
    - name: Build
      run: swift build -v
    - name: Test
      run: swift test -v --enable-code-coverage
    - name: Export coverage
      run: |
        BUILD_PATH="$(swift build --show-bin-path)"
        PROFILE_PATH="${BUILD_PATH}/codecov/default.profdata"
        TEST_BINARY="$(find "${BUILD_PATH}" -type f -perm -111 -path '*.xctest/Contents/MacOS/*' | head -n 1)"

        if [ -z "${TEST_BINARY}" ]; then
          echo "Unable to locate the SwiftPM test bundle executable."
          exit 1
        fi

        xcrun llvm-cov export \
          -format="lcov" \
          -instr-profile="${PROFILE_PATH}" \
          -ignore-filename-regex=".build|Tests" \
          "${TEST_BINARY}" > coverage.lcov
    - name: Upload coverage
      if: ${{ env.CC_TEST_REPORTER_ID != '' }}
      uses: paambaati/codeclimate-action@v9.0.0
      env:
        CC_TEST_REPORTER_ID: ${{ env.CC_TEST_REPORTER_ID }}
      with:
        coverageLocations: coverage.lcov:lcov
        debug: true
  build-linux:
    name: Build and Test (Linux)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - name: Build
      run: swift build -v
    - name: Test
      run: swift test -v
